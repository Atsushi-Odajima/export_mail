{% extends "base.html" %}
{% block title %}操作履歴 - {{ APP_NAME }}{% endblock %}
{% block content %}
<h1>操作履歴</h1>
<p class="small muted">パスワード・API キー・本文は記録しません。</p>
<table class="list small"><thead><tr><th>日時</th><th>操作者</th><th>操作</th><th>対象</th><th>内容</th></tr></thead><tbody>
{% for r in rows %}<tr><td>{{ r.at|t(tz) }}</td><td>{{ r.actor or '' }}</td><td>{{ r.action }}</td><td class="mono">{{ r.target or '' }}</td><td>{{ r.detail or '' }}</td></tr>{% endfor %}</tbody></table>
{% endblock %}
